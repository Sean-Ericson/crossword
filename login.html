<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Crossword</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>">
  <link rel="stylesheet" href="./css/base.css">
</head>
<body>
  <header class="site-header">
    <span class="brand">🧩 Crossword</span>
  </header>

  <main class="login-main">
    <h1>Sign in</h1>
    <form id="login-form">
      <label>Name
        <input id="login-name" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label>Password
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <div class="login-error" id="login-error" role="alert"></div>
      <button class="btn btn-primary" type="submit">Sign in</button>
    </form>
  </main>

  <script type="module" src="./js/login-page.js"></script>
</body>
</html>
